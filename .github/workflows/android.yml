name: Android CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: instabox-medium
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Set version
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          RELEASE_TAG=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
            RELEASE_TAG="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$COMMIT_MSG" =~ \[release\ v([0-9]+\.[0-9]+\.[0-9]+)\] ]]; then
            echo "VERSION_NAME=${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
            RELEASE_TAG="v${BASH_REMATCH[1]}"
          else
            echo "VERSION_NAME=1.0.${{ github.run_number }}" >> "$GITHUB_ENV"
          fi
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Decode keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk "dist/NotePad-${VERSION_NAME}-debug.apk"
          for f in app/build/outputs/apk/release/*.apk; do
            case "$f" in
              *unsigned*) cp "$f" "dist/NotePad-${VERSION_NAME}-release-unsigned.apk" ;;
              *) cp "$f" "dist/NotePad-${VERSION_NAME}-release.apk" ;;
            esac
          done
          ls -la dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NotePad-${{ env.VERSION_NAME }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: NotePad ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          files: dist/*.apk
          generate_release_notes: true
